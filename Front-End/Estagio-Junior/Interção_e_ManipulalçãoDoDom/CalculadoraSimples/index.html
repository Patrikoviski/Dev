<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <script src="script/main.js" defer></script>
    <title>Calculadora Simples</title>
</head>
<body>
    <div class="calc">
        <h1>calculadora</h1>

        <input type="text" name="" id="number1" placeholder="digite um numero inteiro">
        <input type="text" name="" id="number2" placeholder="digite um numero inteiro">
        
        <div class="buttons">
            <button id="soma" data-id="1">+</button>
            <button id="subtracao" data-id="2">-</button>
            <button id="dividir" data-id="3">/</button>
            <button id="multiplicar" data-id="4">*</button>
        </div>
        <p>Resultado:<span id="result"></span></p>
    </div>
</body>
</html>
