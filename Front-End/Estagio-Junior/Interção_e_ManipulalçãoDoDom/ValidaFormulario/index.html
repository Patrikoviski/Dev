<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <script src="script/main.js" defer></script>
    <title>Valida Formulario</title>
</head>
<body>
    <form action="#" method="get" class="formulario">
        <div>
            <label for="email">email</label>
            <input type="text" name="email" id="email" placeholder="seuEmail@gmail.com" required autofocus>
        </div>

        <div>
            <label for="pass">Senha</label>
            <input type="password" name="senha" id="pass" placeholder="digite sua senha" required>
        </div>

        <input type="submit" name="" id="enviar">
    </form>
</body>
</html>
