<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <script src="https://kit.fontawesome.com/9a0be563e3.js" crossorigin="anonymous"></script>
    <script src="script/main.js" defer></script>
    <title>Mostrar/Esconder Senha</title>
</head>
<body>
    <form action="#" method="get" class="formulario">
        <legend>Login</legend>

        <div class="email flex">
            <label for="email">Email</label>
            <input type="text" name="email" id="email" placeholder="seuEmail@gmail.com" autofocus required>
        </div>

        <div class="senha flex">
            <label for="pass">Senha</label>
            <div>
                <input type="password" name="senha" id="pass" placeholder="Digite sua senha" required>
                <i class="fa-solid fa-eye-slash"></i>
            </div>
        </div>

        <input type="submit" name="" id="enviar">
    </form>
</body>
</html>
